name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same PR cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: back/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # config/env.ts refuses to start without these, which is the point —
          # but the suite supplies its own, so these only have to be valid.
          MONGO_URI: mongodb://127.0.0.1:27017/ci
          JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-to-pass
          JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-to-pass

      - name: Build
        run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Only checks; the pre-commit hook is what writes. A failure here means
      # someone committed with --no-verify.
      - run: npm run format:check
