<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="./logo.png" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />   
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title> Tazkarty </title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      PayPal JS SDK. The client id comes from REACT_APP_PAYPAL_CLIENT_ID so
      sandbox and live can differ per environment; it was previously a live
      id hardcoded here, which made sandbox testing impossible.

      `currency` MUST match PAYPAL_CURRENCY on the server. PayPal rejects a
      capture whose currency differs from the one the buttons were loaded with.
    -->
    <script
      defer
      src="https://www.paypal.com/sdk/js?client-id=%REACT_APP_PAYPAL_CLIENT_ID%&currency=USD&intent=capture"
    ></script>
  </body>
</html>
